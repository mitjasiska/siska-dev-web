<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" fill="none" color="#222226" role="img" aria-labelledby="hero-agent-01-title hero-agent-01-desc">
  <title id="hero-agent-01-title">Signal body — agent workflow, concept 01</title>
  <desc id="hero-agent-01-desc">A tall, symmetrical human figure emerges from broken horizontal scans, sparse operators and articulated punctuation. Intent is the head; Plan and Build form the shoulders; two Agents form the core; Review the waist; Commit and Deploy the two grounded legs.</desc>
